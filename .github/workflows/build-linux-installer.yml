name: Build Linux installer package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debian-package:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out fork source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config \
            libsoup-3.0-dev javascriptcoregtk-4.1 \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libnm-dev xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Debian package only
        run: npx tauri build --ci --config src-tauri/tauri.linux-installer.conf.json

      - name: Stage verified release files
        run: |
          mkdir release-assets
          deb_path="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_path"
          dpkg-deb --field "$deb_path" Package | grep -Fx cockpit-tools
          dpkg-deb --field "$deb_path" Architecture | grep -Fx amd64
          cp "$deb_path" release-assets/cockpit-tools-linux-amd64.deb
          (
            cd release-assets
            sha256sum cockpit-tools-linux-amd64.deb > SHA256SUMS.txt
          )

      - name: Publish or update fork installer release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: linux-codex-desktop-latest
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Cockpit Tools Linux Codex fork" \
              --notes "Prebuilt Debian package for Linux Toolbox."
          fi
